<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SwiftDL 下载器</title>
<link rel="stylesheet" href="/style.css?v=4" />
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.6a9.4 9.4 0 1 0 0 18.8 9.4 9.4 0 0 0 0-18.8Zm3.9 10.6-4.4 4.4a.7.7 0 0 1-1 0l-2.2-2.2a.7.7 0 0 1 1-1l1.7 1.7 3.9-3.9a.7.7 0 1 1 1 1Z" />
      </svg>
    </div>
    <div class="appname">SwiftDL</div>
    <div class="titlebar-sub">多源 · 分块 · 并发下载</div>
    <div class="titlebar-spacer"></div>
    <div class="titlebar-right">
      <span class="dot" id="connDot"></span>
      <span id="connText">就绪</span>
    </div>
  </header>

  <div class="toolbar">
    <button class="tbtn primary" id="btnNew">
      <svg viewBox="0 0 24 24"><path d="M11 4a1 1 0 0 1 2 0v7h7a1 1 0 0 1 0 2h-7v7a1 1 0 0 1-2 0v-7H4a1 1 0 0 1 0-2h7V4Z"/></svg>
      新建
    </button>
    <span class="tsep"></span>
    <button class="tbtn" id="btnStart">
      <svg viewBox="0 0 24 24"><path d="M8 5.2c0-.8.9-1.3 1.6-.9l9 6.3a1 1 0 0 1 0 1.7l-9 6.3c-.7.5-1.6 0-1.6-.8V5.2Z"/></svg>
      开始
    </button>
    <button class="tbtn" id="btnPause">
      <svg viewBox="0 0 24 24"><path d="M7 5h3v14H7a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm7 0h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-3V5Z"/></svg>
      暂停
    </button>
    <button class="tbtn" id="btnDelete">
      <svg viewBox="0 0 24 24"><path d="M9 3h6a1 1 0 0 1 1 1v1h4a1 1 0 0 1 0 2h-1l-1 12.1A2 2 0 0 1 16 21H8a2 2 0 0 1-2-1.9L5 7H4a1 1 0 0 1 0-2h4V4a1 1 0 0 1 1-1Zm1 5a1 1 0 0 0-1 1v8a1 1 0 0 0 2 0V9a1 1 0 0 0-1-1Zm4 0a1 1 0 0 0-1 1v8a1 1 0 0 0 2 0V9a1 1 0 0 0-1-1Z"/></svg>
      删除
    </button>
    <span class="tsep"></span>
    <button class="tbtn" id="btnReveal">
      <svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z"/></svg>
      打开目录
    </button>
    <button class="tbtn" id="btnSettings">
      <svg viewBox="0 0 24 24"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Zm9 3.5c0 .5 0 1-.1 1.4l1.9 1.5-1.8 3.1-2.3-.8c-.7.6-1.5 1.1-2.3 1.4L15.9 21h-3.6l-.4-2.4c-.9-.3-1.7-.8-2.4-1.4l-2.3.8-1.8-3.1L7.3 13a9 9 0 0 1 0-2.8L5.4 8.7 7.2 5.6l2.3.8c.7-.6 1.5-1.1 2.4-1.4L12.3 3h3.6l.4 2.1c.9.3 1.7.8 2.4 1.4l2.3-.8 1.8 3.1-1.9 1.5c.1.4.1.9.1 1.4Z"/></svg>
      设置
    </button>
    <div class="toolbar-spacer"></div>
    <div class="speedbox">
      <span class="speed-label">总速度</span>
      <span class="speed-value" id="globalSpeed">0 B/s</span>
    </div>
  </div>

  <main class="main">
    <aside class="sidebar">
      <div class="side-title">下载管理</div>
      <ul class="side-list" id="filters">
        <li data-filter="all">全部任务<span class="cnt" id="cntAll">0</span></li>
        <li data-filter="active" class="on">正在下载<span class="cnt" id="cntActive">0</span></li>
        <li data-filter="completed">已完成<span class="cnt" id="cntDone">0</span></li>
        <li data-filter="failed">失败<span class="cnt" id="cntFail">0</span></li>
      </ul>
      <div class="side-divider"></div>
      <div class="side-title">下载目录</div>
      <div class="side-dir" id="sideDir">-</div>
    </aside>

    <section class="content">
      <div class="thead">
        <div class="c-name">文件名</div>
        <div class="c-size">大小</div>
        <div class="c-prog">进度</div>
        <div class="c-speed">速度</div>
        <div class="c-eta">剩余时间</div>
        <div class="c-state">状态</div>
      </div>
      <div class="tbody" id="list"></div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="statusSpeed">总下载速度 0 B/s</span>
    <span class="ssep"></span>
    <span id="statusCount">正在下载 0 个 / 共 0 个</span>
    <span class="statusbar-spacer"></span>
    <span id="lastUpdate"></span>
    <span id="statusDir"></span>
  </footer>
</div>

<!-- 新建任务 -->
<div class="modal-mask" id="newDlg">
  <div class="modal">
    <div class="modal-head">新建任务<span class="modal-close" data-close="newDlg">×</span></div>
    <div class="modal-body">
      <div class="label">下载地址</div>
      <textarea id="url" rows="3" placeholder="粘贴下载链接，每行一个（可批量添加）"></textarea>
      <div class="hint" id="probeInfo"></div>

      <div class="label">保存到</div>
      <input id="dir" autocomplete="off" />

      <div class="adv-toggle" id="advToggle">高级设置 ▾</div>
      <div class="adv" id="advBox" hidden>
        <label class="label" for="mirrors">镜像地址（每行一个，可分块并发）</label>
        <textarea id="mirrors" rows="2" placeholder="https://mirror.example.com/file.zip"></textarea>
        <div class="grid2">
          <div>
            <div class="label">线程数</div>
            <input id="threads" type="number" min="1" max="128" />
          </div>
          <div>
            <div class="label">限速 (KB/s，0 不限)</div>
            <input id="speedLimit" type="number" min="0" value="0" />
          </div>
        </div>
        <div class="grid2">
          <div>
            <div class="label">重试次数</div>
            <input id="retries" type="number" min="0" max="20" />
          </div>
          <div>
            <div class="label">校验值（可选）</div>
            <input id="hash" placeholder="sha256:... / md5:..." autocomplete="off" />
          </div>
        </div>
      </div>
      <div class="error" id="addError"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" data-close="newDlg">取消</button>
      <button class="btn-primary" id="addBtn">立即下载</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="modal-mask" id="cfgDlg">
  <div class="modal">
    <div class="modal-head">设置<span class="modal-close" data-close="cfgDlg">×</span></div>
    <div class="modal-body">
      <div class="grid2">
        <div>
          <div class="label">同时下载任务数</div>
          <input id="cfgMax" type="number" min="1" max="16" />
        </div>
        <div>
          <div class="label">全局限速 (KB/s，0 不限)</div>
          <input id="cfgLimit" type="number" min="0" />
        </div>
      </div>
      <div class="grid2">
        <div>
          <div class="label">默认线程数</div>
          <input id="cfgThreads" type="number" min="1" max="128" />
        </div>
        <div>
          <div class="label">默认重试次数</div>
          <input id="cfgRetries" type="number" min="0" max="20" />
        </div>
      </div>
      <div class="label">默认保存目录</div>
      <input id="cfgDir" autocomplete="off" />
      <div class="label">代理（留空走系统代理）</div>
      <input id="cfgProxy" placeholder="http://127.0.0.1:7890" autocomplete="off" />
      <div class="hint" id="cfgMsg"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" data-close="cfgDlg">关闭</button>
      <button class="btn-primary" id="saveCfg">保存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/app.js?v=4"></script>
</body>
</html>
